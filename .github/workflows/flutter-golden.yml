# Golden (pixel-snapshot) tests — Al-Tawheed
#
# Verifies the multi-script UI hasn't shifted visually: chapter-badge numerals
# (the Persian-shape bug, 194f7ef), RTL mirroring, theming. See
# test/golden/ and test/flutter_test_config.dart.
#
# macOS ONLY, on purpose. Golden rasterisation is platform-sensitive, so the
# masters are generated (`make goldens-update`) and verified on the same OS
# family. A tolerant comparator (test/flutter_test_config.dart) absorbs the
# residual sub-pixel drift between a dev's Mac and this runner; real glyph or
# layout regressions move whole blocks and still fail.
#
# Runs on:
#   • Pushes to develop that touch UI, theme, fonts, or the goldens.
#   • PRs into master touching the same paths.
#   • Manual dispatch.
#
# Why push-with-a-paths-filter rather than nightly: this repo does not use
# PRs, so the pull_request trigger above effectively never fires, and a
# nightly burns a 10x-billed macOS runner every day whether or not any UI
# changed. The paths filter means goldens run when — and only when — something
# that could move a pixel changed. Tagged `golden` + skipped by default, so
# this is the only job that runs them (via --run-skipped).
#
# History: the nightly failed four runs straight (2026-08) with
# ProviderNotFoundException<ShellChromeProvider>. That was never a golden
# problem — the harness fix (3c9e27d) sat unpushed while the nightly kept
# testing an older origin/develop. Red nightlies nobody can act on train you
# to ignore them; this trigger only fires on code that actually landed.

name: Flutter Golden

on:
  push:
    branches:
      - develop
    paths:
      - 'lib/**'
      - 'assets/fonts/**'
      - 'test/golden/**'
      - 'test/flutter_test_config.dart'
      - '.github/workflows/flutter-golden.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'lib/**'
      - 'assets/fonts/**'
      - 'test/golden/**'
      - 'test/flutter_test_config.dart'
      - '.github/workflows/flutter-golden.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    name: Golden tests — macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter (pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify goldens
        run: flutter test test/golden --run-skipped --reporter=expanded

      # On failure, surface the pixel diffs the comparator wrote next to each
      # golden so a reviewer can see WHAT moved without reproducing locally.
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: 'test/golden/**/failures/*.png'
          if-no-files-found: ignore

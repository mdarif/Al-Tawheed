# Release automation: version, quality gates, signed build, on-device check,
# atomic git finalize, Play internal-track publish, GitHub Release, develop sync.
#
# Job graph (each arrow is a `needs:`; a dry run stops after verify-android):
#
#   prepare -> quality -> build-android -> verify-android
#                                              |
#      (skipped when dry_run) finalize-git -> publish-play -> github-release -> sync-develop
#
# THE RULE: no durable release state (a pushed commit, a tag, a Play release, a
# GitHub Release) exists until verify-android has passed. Before that, the only
# things a run leaves behind are CI artifacts and read-only Play queries.
#
# Each job is resumable. "Re-run failed jobs" on the SAME run is a resume: jobs
# that already succeeded keep their outputs (version, source SHA, AAB SHA-256),
# so nothing is recomputed. Dispatching again from an already-bumped `master`
# is a NEW release. Do not use "Re-run all jobs" after finalize-git has pushed:
# `prepare` would (correctly) refuse the now-existing tag.
#
#   failed job      state left behind               "Re-run failed jobs" does
#   prepare         nothing                         re-checks, recomputes version
#   quality/build   nothing (artifacts only)        rebuilds
#   verify-android  nothing                         re-verifies
#   finalize-git    nothing, or master+tag both     tag absent: create; tag present
#                   (the push is atomic)            and matching: resume; else abort
#   publish-play    tag on master; Play maybe       re-queries Play: upload | assign
#                   uploaded, maybe not             | skip, then proves SHA-256 landed
#   github-release  Play has the build             creates or edits the release
#   sync-develop    release is fully shipped        no-op / leased fast-forward / fail
#
# Dispatch contract (what `make release MODE=...` sends):
#   - from `master`:  the release source is master's tip.
#   - from `develop`: needs confirm_promote=true; develop is promoted to master
#     inside finalize-git, in the same atomic push as the release commit, and
#     only after verify-android. dry_run=true needs no confirm_promote.
# `dry_run: true` runs prepare/quality/build/verify and nothing else: the four
# state-changing jobs carry `if: inputs.dry_run != true` and no status function,
# which test/tool/test_workflows.py proves structurally.
#
# Only `build-android` USES the signing secrets; `prepare` also receives them,
# solely to fail fast if any is missing (presence check, never decoded or
# logged). GOOGLE_PLAY_SERVICE_ACCOUNT is read by `prepare` (read-only
# snapshot) and `publish-play`. DEVELOP_SYNC_TOKEN is read only by
# `sync-develop`.
#
# Prerequisites (one-time GitHub settings):
#   - Settings -> Branches -> master: github-actions[bot] must be able to push
#     (master only blocks force-pushes and deletions today).
#   - Repo secrets for release signing: KEYSTORE_BASE64, KEY_ALIAS,
#     KEY_PASSWORD, STORE_PASSWORD (mirrors android/key.properties).
#   - Repo secret GOOGLE_PLAY_SERVICE_ACCOUNT (service account JSON).
#   - Repo secret PLAY_FGS_MEDIA_DECLARED=true: the app declares
#     FOREGROUND_SERVICE_MEDIA_PLAYBACK; Play requires an accepted declaration
#     form. See docs/ci-cd.md -> "One-Time Setup".
#   - Repo secret DEVELOP_SYNC_TOKEN (admin PAT) for the develop fast-forward.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'patch = bug fix · minor = new feature · major = breaking change'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      confirm_promote:
        description: 'Required (true) to promote develop -> master when dispatched from develop. Ignored when dispatched from master.'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Run quality/build/verify only - skip the git push, tag, Play publish, GitHub Release and the develop sync.'
        required: false
        default: false
        type: boolean
      skip_verify:
        description: 'Emergency hotfix only - skip the on-device release APK verification.'
        required: false
        default: false
        type: boolean

# Read-only by default; finalize-git and github-release opt in to write.
permissions:
  contents: read

# Two concurrent releases would race on the same tag and the same push to
# master. Queue rather than cancel: a half-finished release must be allowed to
# finish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ #
  # Prepare: cheap, fail-fast, no Flutter, no Gradle. Pins the immutable
  # source SHA, computes the version ONCE, and snapshots Play read-only.
  # ------------------------------------------------------------------ #
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      new_version: ${{ steps.version.outputs.new_version }}
      new_semver: ${{ steps.version.outputs.new_semver }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}
      apk: ${{ steps.version.outputs.apk }}
      aab: ${{ steps.version.outputs.aab }}

    steps:
      # A dispatch from any other ref used to be a silent green no-op.
      - name: Validate the dispatch
        env:
          REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM_PROMOTE: ${{ inputs.confirm_promote }}
        run: |
          case "$REF" in
            refs/heads/master) ;;
            refs/heads/develop)
              if [ "$DRY_RUN" != "true" ] && [ "$CONFIRM_PROMOTE" != "true" ]; then
                echo "::error::Dispatched from develop without confirm_promote=true. Refusing to promote develop -> master (this guards against accidentally shipping stale code). Re-run with confirm_promote: true, or dispatch from master."
                exit 1
              fi ;;
            *)
              echo "::error::Releases run from refs/heads/master or refs/heads/develop only (got ${REF})."
              exit 1 ;;
          esac

      # fetch-depth: 0 - the duplicate-tag guard needs every tag.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      # github.sha is fixed when the workflow is dispatched, so a push to the
      # branch while this run is in flight cannot change what gets released.
      - name: Pin the source SHA
        id: source
        run: |
          SHA="$(git rev-parse HEAD)"
          if [ "$SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Checked out ${SHA}, expected the dispatched ${GITHUB_SHA}."
            exit 1
          fi
          echo "source_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Releasing from ${GITHUB_REF_NAME} @ ${SHA}"

      # subosito/flutter-action reads the SDK pin from pubspec.yaml with yq.
      # Fail here, in seconds, rather than in the middle of a later job.
      - name: Require yq (needed by the Flutter setup action)
        run: |
          if ! yq --version; then
            echo "::error::yq is not available on this runner image; subosito/flutter-action needs it to read the SDK pin from pubspec.yaml."
            exit 1
          fi

      # The ONLY place a version is computed. It is exported as a job output
      # and every later job uses that exact string; nothing recomputes it from
      # the bump. Does not write pubspec.yaml.
      - name: Compute release version
        id: version
        run: |
          python3 tool/compute_release_version.py \
            --bump "${{ inputs.bump }}" \
            --github-output "$GITHUB_OUTPUT"

      # The Play "What's new" text is the curated block in
      # docs/release-notes/<version>.md. Validated HERE (no `if:`, so a dry run
      # runs it too, unlike publish-play): an over-500-byte text fails in
      # seconds, before the build, not at publish time. Absent text only warns;
      # publish-play then falls back to the git-cliff changelog.
      - name: Validate the curated Play "What's new" text
        run: |
          python3 tool/release_git.py play-notes \
            --version "${{ steps.version.outputs.new_semver }}" \
            --check

      # Checked here, not after the build: an empty secret makes Gradle fall
      # back to the DEBUG signing key silently.
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          MISSING=""
          [ -z "$KEYSTORE_BASE64" ] && MISSING="$MISSING KEYSTORE_BASE64"
          [ -z "$KEY_ALIAS" ]       && MISSING="$MISSING KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]    && MISSING="$MISSING KEY_PASSWORD"
          [ -z "$STORE_PASSWORD" ]  && MISSING="$MISSING STORE_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing signing secret(s):${MISSING}. Run 'make setup-release-secrets'. See docs/ci-cd.md -> 'One-Time Setup'."
            exit 1
          fi
          echo "All four signing secrets are present."

      - name: Require Play Store service account
        if: inputs.dry_run != true
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT secret is not set. See docs/ci-cd.md -> 'One-Time Setup' -> 'Add CD Phase 3 Play Store secret'."
            exit 1
          fi

      # Fails now, not after a twenty-minute build and an on-device check.
      - name: Foreground-service declaration preflight
        if: inputs.dry_run != true
        env:
          PLAY_FGS_MEDIA_DECLARED: ${{ secrets.PLAY_FGS_MEDIA_DECLARED }}
        run: python3 tool/play_release_preflight.py manifest

      # Read-only: opens and deletes a throwaway edit. A stale snapshot is
      # fine; publish-play re-queries before it decides anything.
      - name: Snapshot Play state (read-only)
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          python3 tool/play_release_preflight.py snapshot \
            --version-code "${{ steps.version.outputs.build_number }}" \
            --optional

      - name: Release summary
        run: |
          {
            echo "### Release ${{ steps.version.outputs.tag }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Source | \`${GITHUB_REF_NAME}\` @ \`${{ steps.source.outputs.source_sha }}\` |"
            echo "| Version | \`${{ steps.version.outputs.new_version }}\` |"
            echo "| Tag | \`${{ steps.version.outputs.tag }}\` |"
            echo "| Dry run | \`${{ inputs.dry_run }}\` |"
            echo "| Device verification | \`${{ inputs.skip_verify == true && 'SKIPPED' || 'enabled' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ #
  # Quality: the Makefile's own gates, none of which rewrite a file.
  # ------------------------------------------------------------------ #
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    needs: [prepare]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up Flutter (pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Install Flutter dependencies
        run: flutter pub get

      # The workflow-structure tests parse YAML with a pinned PyYAML. A venv
      # because the runner's system Python is externally managed.
      - name: Install pinned PyYAML for the tooling tests
        run: |
          python3 -m venv "$RUNNER_TEMP/tooling-venv"
          "$RUNNER_TEMP/tooling-venv/bin/python" -m pip install --quiet PyYAML==6.0.3
          echo "$RUNNER_TEMP/tooling-venv/bin" >> "$GITHUB_PATH"

      - name: Check formatting (does not rewrite)
        run: make format-check

      - name: Analyze code
        run: make analyze

      - name: Run tests
        run: make test

      # The release tooling computes the tag and the Play versionCode, decides
      # the Play action and the git pushes. It is gated like app code.
      - name: Test release tooling
        run: make test-tooling

  # ------------------------------------------------------------------ #
  # Build: the only job that touches the signing secrets. Builds EXACTLY
  # the version `prepare` computed and records the AAB's SHA-256.
  # ------------------------------------------------------------------ #
  build-android:
    name: Build Android release artifacts
    runs-on: ubuntu-latest
    needs: [prepare, quality]
    outputs:
      aab_sha256: ${{ steps.hash.outputs.aab_sha256 }}
      apk_sha256: ${{ steps.hash.outputs.apk_sha256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      # ubuntu-latest ships large unused toolchains that leave too little
      # headroom for the Android SDK + Gradle cache + the APK and AAB
      # ("No space left on device", hit on 2026-06-12).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      # Java 21 - matches android/app/build.gradle compileOptions
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter (pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle', 'android/settings.gradle', 'android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Override Gradle JVM args
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options=-Xmx1g" >> android/gradle.properties

      - name: Install Flutter dependencies
        run: flutter pub get

      # Stamps the exact version string `prepare` computed (never a recompute
      # from the bump) and fails if pubspec.yaml does not read back as it.
      - name: Apply the release version to pubspec.yaml
        run: |
          python3 tool/release_git.py stamp \
            --new-version "${{ needs.prepare.outputs.new_version }}"
          grep '^version:' pubspec.yaml

      # Decodes KEYSTORE_BASE64 into android/app/upload-keystore.jks and writes
      # android/key.properties, matching signingConfigs.release in
      # android/app/build.gradle. Presence was verified in `prepare`.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      # What was built is what `prepare` computed: the pubspec still reads
      # back as new_version, and any AGP output-metadata.json agrees.
      - name: Assert the build is exactly the release version
        run: |
          python3 tool/release_git.py assert-version \
            --new-version "${{ needs.prepare.outputs.new_version }}"
          python3 tool/release_git.py assert-build \
            --new-version "${{ needs.prepare.outputs.new_version }}"

      - name: Rename artifacts
        run: |
          mkdir -p release-artifacts
          mv build/app/outputs/flutter-apk/app-release.apk \
             "release-artifacts/${{ needs.prepare.outputs.apk }}"
          mv build/app/outputs/bundle/release/app-release.aab \
             "release-artifacts/${{ needs.prepare.outputs.aab }}"
          ls -lh release-artifacts

      # publish-play proves the AAB it uploads is this exact file, and that
      # Play's own reported SHA-256 equals it.
      - name: Record artifact SHA-256
        id: hash
        run: |
          cd release-artifacts
          AAB_SHA="$(sha256sum "${{ needs.prepare.outputs.aab }}" | cut -d' ' -f1)"
          APK_SHA="$(sha256sum "${{ needs.prepare.outputs.apk }}" | cut -d' ' -f1)"
          {
            echo "aab_sha256=${AAB_SHA}"
            echo "apk_sha256=${APK_SHA}"
          } >> "$GITHUB_OUTPUT"
          sha256sum "${{ needs.prepare.outputs.aab }}" "${{ needs.prepare.outputs.apk }}" | tee SHA256SUMS

      # compression-level: 0 - an APK/AAB is already deflated. overwrite: a
      # re-run of this job replaces its own artifact instead of failing.
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v6
        with:
          name: android-release
          path: release-artifacts/*
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  # ------------------------------------------------------------------ #
  # Verify: installs the EXACT signed artifact that will ship onto a real
  # Android image and drives it. A clean runner with no signing secrets and
  # no build tree: it can only see what users get.
  # ------------------------------------------------------------------ #
  verify-android:
    name: Verify Android release APK
    runs-on: ubuntu-latest
    needs: [prepare, build-android]
    outputs:
      verified: ${{ steps.record.outputs.verified }}

    steps:
      - name: Record explicit verification bypass
        if: inputs.skip_verify == true
        run: |
          echo "::warning::Release APK verification was SKIPPED via skip_verify. The signed artifact about to ship has not been installed or launched anywhere."
          echo "⚠️ **Device verification bypassed** via \`skip_verify\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        if: inputs.skip_verify != true
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Download Android artifacts
        if: inputs.skip_verify != true
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-artifacts

      # apksigner is a Java program and is NOT on a stock runner's PATH; without
      # a JRE it cannot run at all. This job builds nothing, so it would
      # otherwise have no Java.
      - name: Set up Java 21
        if: inputs.skip_verify != true
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Deterministic checks first - no emulator needed, so a packaging or
      # signing fault reports in seconds rather than after a boot.
      # --require-signature-check: in CI an apksigner that cannot run is a HARD
      # failure; degrading to a warning would retire the one guard that catches
      # a debug-signed release.
      - name: Inspect release APK
        if: inputs.skip_verify != true
        run: |
          python3 tool/verify_release_apk.py \
            --apk "release-artifacts/${{ needs.prepare.outputs.apk }}" \
            --inspect-only \
            --require-signature-check

      - name: Enable KVM
        if: inputs.skip_verify != true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # NOTE: the `script:` command MUST stay on ONE line. The action wraps it
      # in `sh -c`, which drops backslash continuations - a multi-line script
      # silently runs only its first fragment. See docs/gotchas.md.
      - name: Install, launch, and resume the release APK
        if: inputs.skip_verify != true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 tool/verify_release_apk.py --apk "release-artifacts/${{ needs.prepare.outputs.apk }}" --device emulator-5554 --evidence-dir verify-evidence

      # `!cancelled()` and not `failure()`: the screenshot and logcat of a
      # crashed or blank first screen are the entire point of this upload.
      - name: Upload verification evidence
        if: ${{ !cancelled() && inputs.skip_verify != true }}
        uses: actions/upload-artifact@v6
        with:
          name: verify-evidence
          path: verify-evidence
          retention-days: 14
          if-no-files-found: warn
          overwrite: true

      # The ONLY source of the release notes' device-verification claim. It is
      # set after the emulator step passed, so a skipped or failed check can
      # never produce it.
      - name: Record that the device check passed
        id: record
        if: inputs.skip_verify != true
        run: echo "verified=true" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ #
  # Finalize git: the first durable state. ONE atomic push of master (with the
  # develop promote when dispatched from develop) + release commit + tag.
  # Resumable: see tool/release_git.py resume_decision.
  # ------------------------------------------------------------------ #
  finalize-git:
    name: Finalize git (commit, tag, push)
    runs-on: ubuntu-latest
    needs: [prepare, build-android, verify-android]
    if: inputs.dry_run != true
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.finalize.outputs.release_sha }}

    steps:
      # fetch-depth: 0 - the resume checks walk history and tags.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit, tag, and push atomically
        id: finalize
        run: |
          python3 tool/release_git.py finalize \
            --source-sha "${{ needs.prepare.outputs.source_sha }}" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --new-version "${{ needs.prepare.outputs.new_version }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Finalize summary
        run: |
          {
            echo "### Git finalized"
            echo ""
            echo "Tag \`${{ needs.prepare.outputs.tag }}\` at \`${{ steps.finalize.outputs.release_sha }}\` (resumed: \`${{ steps.finalize.outputs.resumed }}\`)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ #
  # Publish to Play (internal track). Builds nothing. Re-queries Play itself
  # (the snapshot in `prepare` may be stale), then: upload if absent, assign
  # an already-uploaded bundle without re-uploading, or skip if that exact
  # artifact is already completed. Finally proves Play shows our SHA-256.
  # ------------------------------------------------------------------ #
  publish-play:
    name: Publish to Play (internal track)
    runs-on: ubuntu-latest
    needs: [prepare, build-android, verify-android, finalize-git]
    if: inputs.dry_run != true

    steps:
      # fetch-depth: 0 - git-cliff walks every tag to build the range.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.finalize-git.outputs.release_sha }}

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-artifacts

      - name: Require the AAB that build-android produced
        run: |
          ACTUAL="$(sha256sum "release-artifacts/${{ needs.prepare.outputs.aab }}" | cut -d' ' -f1)"
          EXPECTED="${{ needs.build-android.outputs.aab_sha256 }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::The downloaded AAB (${ACTUAL}) is not the one build-android recorded (${EXPECTED})."
            exit 1
          fi
          echo "AAB SHA-256 ${ACTUAL}"

      # The tag exists now, so the changelog is the LATEST tag's section
      # (`--unreleased` was only right while the tag did not exist yet).
      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}

      # Play Store "What's new": 500 BYTES per locale, hard limit. The text is
      # the curated block in docs/release-notes/<version>.md, validated (and
      # never truncated) by tool/release_git.py; `prepare` already checked it.
      # Only when there is no curated block does it fall back to the git-cliff
      # changelog, cut on a whole line and never mid-character, with a warning.
      # The changelog goes via env + file, NOT inline `${{ }}` - commit
      # subjects contain double quotes that would close the bash string.
      - name: Generate Play Store release notes
        env:
          MARKDOWN: ${{ steps.cliff.outputs.content }}
        run: |
          printf '%s\n' "$MARKDOWN" > changelog.md
          python3 tool/release_git.py play-notes \
            --version "${{ needs.prepare.outputs.new_semver }}" \
            --changelog-file changelog.md \
            --out play-store-notes.txt
          echo "Play Store notes:"
          cat play-store-notes.txt
          echo

      # The Play listing's default (and only) language is en-GB, so the notes
      # go there. Notes under a language the listing does not have attach to
      # nothing (2.4.2/2.4.3 sent en-US/ar/ur and the promotion form showed
      # "0 languages"). test/tool/test_workflows.py pins this list. See
      # docs/release-runbook.md.
      - name: Prepare Play Store release notes for upload
        run: |
          mkdir -p distribution/whatsnew
          for LOCALE in en-GB; do
            cp play-store-notes.txt "distribution/whatsnew/whatsnew-${LOCALE}"
          done
          ls distribution/whatsnew

      # Re-queries Play now. Fails on a conflicting versionCode (a different
      # artifact already owns it) before anything is written.
      - name: Decide the Play action
        id: decide
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          python3 tool/play_release_preflight.py decide \
            --version-code "${{ needs.prepare.outputs.build_number }}" \
            --aab "release-artifacts/${{ needs.prepare.outputs.aab }}" \
            --github-output "$GITHUB_OUTPUT"

      # Upload + assign + complete in the action's single committed edit.
      # continue-on-error: a failed-looking upload may still have committed, so
      # the verify step below re-queries Play and decides; it does not trust
      # this step's status either way.
      - name: Upload to Play Store (internal track)
        id: upload
        if: steps.decide.outputs.action == 'upload'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.almarfa.tawheed
          releaseFiles: release-artifacts/${{ needs.prepare.outputs.aab }}
          track: internal
          status: completed
          whatsNewDirectory: distribution/whatsnew

      # The bundle is already on Play (a previous attempt uploaded it): assign
      # it to the track and complete it in ONE committed edit, no re-upload.
      - name: Assign the uploaded bundle to the internal track
        id: assign
        if: steps.decide.outputs.action == 'assign'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          python3 tool/play_release_preflight.py assign \
            --version-code "${{ needs.prepare.outputs.build_number }}" \
            --aab "release-artifacts/${{ needs.prepare.outputs.aab }}" \
            --notes-dir distribution/whatsnew

      # Proof, not trust: Play must now report OUR bundle SHA-256 as completed.
      - name: Verify Play shows this exact build
        if: steps.decide.outputs.action == 'upload' || steps.decide.outputs.action == 'assign'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          python3 tool/play_release_preflight.py verify \
            --version-code "${{ needs.prepare.outputs.build_number }}" \
            --aab "release-artifacts/${{ needs.prepare.outputs.aab }}"

      # overwrite: a re-run of this job replaces the artifact.
      - name: Upload Play Store notes
        uses: actions/upload-artifact@v6
        with:
          name: play-notes
          path: play-store-notes.txt
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  # ------------------------------------------------------------------ #
  # GitHub Release: create-or-edit for the validated tag; assets replaced.
  # Only after Play has the exact artifact.
  # ------------------------------------------------------------------ #
  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build-android, verify-android, finalize-git, publish-play]
    if: inputs.dry_run != true
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.finalize-git.outputs.release_sha }}

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-artifacts

      - name: Download Play Store notes
        uses: actions/download-artifact@v4
        with:
          name: play-notes
          path: play-notes

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}

      # The notes (including the device-verification line) are built by
      # tool/release_git.py from `verified`, which verify-android sets only
      # when the emulator check actually ran. The body is the curated
      # "GitHub Release notes" section of docs/release-notes/<version>.md when
      # it exists, else the git-cliff changelog. The changelog goes via env +
      # file: commit subjects contain quotes and backticks.
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG: ${{ steps.cliff.outputs.content }}
          VERIFIED: ${{ needs.verify-android.outputs.verified == 'true' && 'true' || 'false' }}
        run: |
          printf '%s\n' "$CHANGELOG" > changelog.md
          python3 tool/release_git.py github-release \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --new-version "${{ needs.prepare.outputs.new_version }}" \
            --apk-name "${{ needs.prepare.outputs.apk }}" \
            --aab-sha256 "${{ needs.build-android.outputs.aab_sha256 }}" \
            --verified "$VERIFIED" \
            --changelog-file changelog.md \
            --release-notes-version "${{ needs.prepare.outputs.new_semver }}" \
            --title "Al-Tawheed ${{ needs.prepare.outputs.tag }}" \
            --asset "release-artifacts/${{ needs.prepare.outputs.apk }}#Al-Tawheed Android APK (release, signed)" \
            --asset "release-artifacts/${{ needs.prepare.outputs.aab }}#Al-Tawheed Android App Bundle (release, signed)" \
            --asset "play-notes/play-store-notes.txt#Play Store release notes (plain text)"

  # ------------------------------------------------------------------ #
  # Dry run summary: a dry run must prove it BUILT and VERIFIED, not merely
  # that nothing errored.
  # ------------------------------------------------------------------ #
  dry-run-summary:
    name: Dry run summary
    runs-on: ubuntu-latest
    needs: [prepare, quality, build-android, verify-android]
    if: inputs.dry_run == true

    steps:
      - name: Report
        run: |
          echo "::notice::Dry run complete for ${{ github.ref_name }} - version ${{ needs.prepare.outputs.new_version }} computed, quality gates passed, signed APK + AAB built (AAB SHA-256 ${{ needs.build-android.outputs.aab_sha256 }}) and device verification ${{ inputs.skip_verify == true && 'SKIPPED' || 'passed' }}. Nothing was committed, tagged, pushed, published or released."
          {
            echo "### ✅ Dry run passed"
            echo ""
            echo "Would have released \`${{ needs.prepare.outputs.tag }}\` (\`${{ needs.prepare.outputs.new_version }}\`)."
            echo "Artifacts are attached to this run for 14 days."
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ #
  # Sync develop: the last step. No-op if develop already has the tag;
  # fast-forward with a lease only if develop still equals the source SHA;
  # otherwise fail with merge instructions. Never overwrites anything.
  # ------------------------------------------------------------------ #
  sync-develop:
    name: Sync develop with the release
    runs-on: ubuntu-latest
    needs: [prepare, finalize-git, github-release]
    if: inputs.dry_run != true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.finalize-git.outputs.release_sha }}
          # Push to the protected `develop` branch as the repo owner (admin) so
          # the fast-forward isn't rejected by the "Flutter CI" required check -
          # the default GITHUB_TOKEN (github-actions[bot]) has no bypass. The
          # PAT is exposed to this job only. See docs/gotchas.md -> CI / release.
          token: ${{ secrets.DEVELOP_SYNC_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward develop safely
        run: |
          python3 tool/release_git.py sync-develop \
            --source-sha "${{ needs.prepare.outputs.source_sha }}" \
            --release-sha "${{ needs.finalize-git.outputs.release_sha }}" \
            --tag "${{ needs.prepare.outputs.tag }}"

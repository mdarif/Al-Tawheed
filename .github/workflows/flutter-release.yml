# CD Phase 1 — Release Automation (+ CD Phase 1.5 — promote/sync automation,
# CD Phase 2 — production-signed APK/AAB, CD Phase 3 — Play Store
# internal-track upload, CD Phase 4c — release-artifact verification)
#
# Job graph:
#
#   promote -> prepare -> build-android -> verify-android -> publish -> sync-develop
#
# Split out of a single monolithic job so that (a) a bad version or a missing
# signing secret fails in `prepare` in ~30s instead of after a twenty-minute
# Gradle build, and (b) the signed APK that ships is actually installed and
# launched on a device by `verify-android` before `publish` can upload it.
# Only `build-android` ever sees the signing secrets.
#
# One-click release: dispatch from `develop` with `confirm_promote: true`.
# Traditional flow: dispatch from `master` (promote/sync are skipped).
# Use `dry_run: true` to run analyze/test/build/verify only — no commits,
# tags, releases, pushes, or Play Store uploads of any kind.
#
# WHY every downstream job carries `always() && needs.X.result == 'success'`:
# `needs:` propagates SKIPS transitively. On a dry run `promote` is skipped, so
# a plain `needs:` chain would cascade-skip the entire pipeline and report a
# green run that built nothing — a false all-clear on the exact flow whose job
# is to catch problems. The explicit result checks below are load-bearing; do
# not "simplify" them away. See docs/gotchas.md -> CI / release.
#
# Prerequisites (one-time GitHub settings):
#   - Settings -> Branches -> master -> Bypass list -> add github-actions[bot]
#     Without this, the version-bump push to master will be rejected.
#   - Repo secrets for release signing (CD Phase 2): KEYSTORE_BASE64,
#     KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD (mirrors android/key.properties).
#   - Repo secret for Play Store upload (CD Phase 3):
#     GOOGLE_PLAY_SERVICE_ACCOUNT (service account JSON, Release Manager).
#   - Repo secret PLAY_FGS_MEDIA_DECLARED=true — the app declares
#     FOREGROUND_SERVICE_MEDIA_PLAYBACK; Play requires an accepted declaration
#     form. See docs/ci-cd.md -> "One-Time Setup".
#   - Repo secret DEVELOP_SYNC_TOKEN for the develop fast-forward.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'patch = bug fix · minor = new feature · major = breaking change'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      confirm_promote:
        description: 'Required (true) to promote develop -> master when dispatched from develop. Ignored when dispatched from master.'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Run analyze/test/build/verify only - skip promote, tag, release, Play upload, and the develop sync.'
        required: false
        default: false
        type: boolean
      skip_verify:
        description: 'Emergency hotfix only - skip the on-device release APK verification.'
        required: false
        default: false
        type: boolean

# GITHUB_TOKEN needs write access to push the version-bump commit, the tag,
# the develop sync, and to create the GitHub Release.
permissions:
  contents: write

# Two concurrent releases would race on the same tag and the same
# `git push origin HEAD:master`. Queue rather than cancel: a half-finished
# release that has already uploaded to Play must be allowed to finish tagging.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ #
  # Promote develop -> master (CD Phase 1.5)
  #
  # Fast-forward only: if master has diverged from develop in a way that
  # can't fast-forward, this fails rather than guessing at a merge — see
  # docs/release-runbook.md -> Troubleshooting.
  # ------------------------------------------------------------------ #
  promote:
    name: Promote develop to master
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && inputs.dry_run != true
    outputs:
      sha: ${{ steps.merge.outputs.sha }}

    steps:
      - name: Require confirm_promote
        if: inputs.confirm_promote != true
        run: |
          echo "::error::Dispatched from develop without confirm_promote=true. Refusing to promote develop -> master (this guards against accidentally shipping stale code on master). Re-run with confirm_promote: true, or dispatch from master for the traditional flow."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward master to develop
        id: merge
        run: |
          git fetch origin develop master
          git checkout -B master origin/master
          git merge --ff-only origin/develop
          git push origin master
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ #
  # Prepare — cheap, fail-fast gate. No Flutter, no Gradle, no secrets
  # consumed beyond an emptiness check. Everything that can reject a
  # release without building it happens here.
  # ------------------------------------------------------------------ #
  prepare:
    name: Prepare release version
    runs-on: ubuntu-latest
    needs: [promote]
    if: |
      always() &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') &&
      (needs.promote.result == 'success' || needs.promote.result == 'skipped')
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      new_version: ${{ steps.version.outputs.new_version }}
      new_semver: ${{ steps.version.outputs.new_semver }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}
      apk: ${{ steps.version.outputs.apk }}
      aab: ${{ steps.version.outputs.aab }}

    steps:
      - name: Resolve release ref
        id: resolve
        run: |
          # The SHA promote just pushed to master, or the triggering ref itself
          # (master in the traditional flow, develop for a dry run).
          REF="${{ needs.promote.outputs.sha || github.ref_name }}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Releasing from ${REF}"

      # fetch-depth: 0 — the duplicate-tag guard needs every tag, and the
      # changelog in `publish` needs full history.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.resolve.outputs.ref }}

      # Fails on an unparseable pubspec or an already-released tag. Does NOT
      # pass --write: the version is applied in build-android, on its own
      # checkout, so a rejected release leaves no half-bumped file behind.
      - name: Compute release version
        id: version
        run: |
          python3 tool/compute_release_version.py \
            --bump "${{ inputs.bump }}" \
            --github-output "$GITHUB_OUTPUT"

      # Checked here, not after the build: an empty secret makes Gradle fall
      # back to the DEBUG signing key silently, and the failure would otherwise
      # surface twenty minutes later (or, worse, not at all).
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          MISSING=""
          [ -z "$KEYSTORE_BASE64" ] && MISSING="$MISSING KEYSTORE_BASE64"
          [ -z "$KEY_ALIAS" ]       && MISSING="$MISSING KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]    && MISSING="$MISSING KEY_PASSWORD"
          [ -z "$STORE_PASSWORD" ]  && MISSING="$MISSING STORE_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing signing secret(s):${MISSING}. Run 'make setup-release-secrets'. See docs/ci-cd.md -> 'One-Time Setup'."
            exit 1
          fi
          echo "All four signing secrets are present."

      - name: Require Play Store service account
        if: inputs.dry_run != true
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT secret is not set. See docs/ci-cd.md -> 'One-Time Setup' -> 'Add CD Phase 3 Play Store secret'."
            exit 1
          fi

      - name: Release summary
        run: |
          {
            echo "### Release ${{ steps.version.outputs.tag }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Ref | \`${{ steps.resolve.outputs.ref }}\` |"
            echo "| Version | \`${{ steps.version.outputs.new_version }}\` |"
            echo "| Tag | \`${{ steps.version.outputs.tag }}\` |"
            echo "| Dry run | \`${{ inputs.dry_run }}\` |"
            echo "| Device verification | \`${{ inputs.skip_verify == true && 'SKIPPED' || 'enabled' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ #
  # Build — the only job that touches the signing secrets.
  # ------------------------------------------------------------------ #
  build-android:
    name: Build Android release artifacts
    runs-on: ubuntu-latest
    needs: [promote, prepare]
    if: always() && needs.prepare.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.ref }}

      # ubuntu-latest runners ship large unused toolchains (.NET, GHC, CodeQL)
      # that leave too little headroom for the Android SDK + Gradle cache + the
      # APK and AAB. Without this, packaging fails with "No space left on
      # device" (hit on 2026-06-12).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      # Java 21 — matches android/app/build.gradle compileOptions
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter (pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle', 'android/settings.gradle', 'android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Override Gradle JVM args
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options=-Xmx1g" >> android/gradle.properties

      - name: Install Flutter dependencies
        run: flutter pub get

      # ---------------- Quality gates: refuse to tag a bad build -------- #
      - name: Verify formatting
        run: dart format --set-exit-if-changed lib test tool integration_test patrol_test

      - name: Analyze code
        run: flutter analyze --fatal-warnings

      - name: Run tests
        run: flutter test --reporter=expanded

      # The release tooling computes the tag and the Play versionCode. A bug
      # there is expensive and invisible, so it is gated like app code.
      - name: Test release tooling
        run: python3 -m unittest discover -s test/tool

      # Applied here rather than in `prepare` so a rejected release never
      # leaves a mutated pubspec.yaml behind on any checkout.
      - name: Apply release version to pubspec.yaml
        run: |
          python3 tool/compute_release_version.py \
            --bump "${{ inputs.bump }}" --write --no-check-tag
          grep '^version:' pubspec.yaml

      # CD Phase 2 — decodes KEYSTORE_BASE64 into android/app/upload-keystore.jks
      # and writes android/key.properties, matching signingConfigs.release in
      # android/app/build.gradle. Presence was already verified in `prepare`.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Rename artifacts
        run: |
          mkdir -p release-artifacts
          mv build/app/outputs/flutter-apk/app-release.apk \
             "release-artifacts/${{ needs.prepare.outputs.apk }}"
          mv build/app/outputs/bundle/release/app-release.aab \
             "release-artifacts/${{ needs.prepare.outputs.aab }}"
          ls -lh release-artifacts

      # compression-level: 0 — an APK/AAB is already deflated; re-compressing
      # costs minutes and saves nothing. if-no-files-found: error so a silent
      # rename change cannot produce an empty "successful" release.
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-artifacts/*
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  # ------------------------------------------------------------------ #
  # Verify — installs the EXACT signed artifact that will ship onto a
  # real Android image and drives it. Runs on a clean runner with no
  # signing secrets and no build tree: it can only see what users get.
  # ------------------------------------------------------------------ #
  verify-android:
    name: Verify Android release APK
    runs-on: ubuntu-latest
    needs: [prepare, build-android]
    if: always() && needs.build-android.result == 'success'

    steps:
      - name: Record explicit verification bypass
        if: inputs.skip_verify == true
        run: |
          echo "::warning::Release APK verification was SKIPPED via skip_verify. The signed artifact about to ship has not been installed or launched anywhere."
          echo "⚠️ **Device verification bypassed** via \`skip_verify\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        if: inputs.skip_verify != true
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download Android artifacts
        if: inputs.skip_verify != true
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-artifacts

      # apksigner is a Java program and is NOT on a stock runner's PATH; the
      # verifier globs $ANDROID_SDK_ROOT/build-tools/*/apksigner for it, but
      # without a JRE it cannot run at all. This job builds nothing, so it
      # would otherwise have no Java.
      - name: Set up Java 21
        if: inputs.skip_verify != true
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Deterministic checks first — no emulator needed, so a packaging or
      # signing fault reports in seconds rather than after a boot.
      # --require-signature-check: in CI, an apksigner that cannot run is a
      # HARD failure. Degrading to a warning here would retire the one guard
      # that catches a debug-signed release — precisely the situation a broken
      # signing setup produces.
      - name: Inspect release APK
        if: inputs.skip_verify != true
        run: |
          python3 tool/verify_release_apk.py \
            --apk "release-artifacts/${{ needs.prepare.outputs.apk }}" \
            --inspect-only \
            --require-signature-check

      - name: Enable KVM
        if: inputs.skip_verify != true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # NOTE: the `script:` command MUST stay on ONE line. The action wraps it
      # in `sh -c`, which drops backslash continuations — a multi-line script
      # silently runs only its first fragment. See docs/gotchas.md.
      - name: Install, launch, and resume the release APK
        if: inputs.skip_verify != true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 tool/verify_release_apk.py --apk "release-artifacts/${{ needs.prepare.outputs.apk }}" --device emulator-5554 --evidence-dir verify-evidence

      # `!cancelled()` and not `failure()`: the screenshot and logcat of a
      # crashed or blank first screen are the entire point of this upload.
      - name: Upload verification evidence
        if: ${{ !cancelled() && inputs.skip_verify != true }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence
          path: verify-evidence
          retention-days: 14
          if-no-files-found: warn

  # ------------------------------------------------------------------ #
  # Publish — builds nothing. Changelog, Play upload, tag, GitHub Release.
  # Skipped entirely on a dry run.
  # ------------------------------------------------------------------ #
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [prepare, build-android, verify-android]
    if: |
      always() &&
      inputs.dry_run != true &&
      needs.build-android.result == 'success' &&
      needs.verify-android.result == 'success'

    steps:
      # fetch-depth: 0 — git-cliff walks every tag to build the range.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-artifacts

      # Structured changelog from conventional commits: git-cliff groups
      # feat/fix/perf and skips ci/chore/docs noise.
      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}

      # Play Store "What's new": 500 characters per locale, hard limit.
      # Pass the changelog via env, NOT inline `${{ }}` — commit subjects
      # contain double quotes (e.g. 'Now Playing') that would close the bash
      # string and break the step with exit 127.
      - name: Generate Play Store release notes
        env:
          MARKDOWN: ${{ steps.cliff.outputs.content }}
        run: |
          PLAIN=$(echo "$MARKDOWN" \
            | sed 's/^### //g' \
            | sed 's/\*\*//g' \
            | sed 's/^- /• /g' \
            | sed '/^$/d')

          TRUNCATED=$(echo "$PLAIN" | head -c 500)
          FULL_LEN=$(echo "$PLAIN" | wc -c | tr -d ' ')
          if [ "$FULL_LEN" -gt 500 ]; then
            echo "::warning::Play Store notes truncated to 500 chars (was ${FULL_LEN}). Review before promoting to production."
          fi

          echo "$TRUNCATED" > play-store-notes.txt
          echo "Play Store notes:"
          cat play-store-notes.txt

      # r0adkll/upload-google-play expects a directory of locale-named files.
      # The app ships four locales (ar, en, ur, and the Arabic edition chrome),
      # but release notes are authored in English only — so every locale gets
      # the en-US text DELIBERATELY, rather than Play falling back on its own
      # because a file happened to be absent. Release notes are the one
      # user-facing string set not covered by ARB parity; translating them is
      # tracked separately. See docs/release-runbook.md.
      - name: Prepare Play Store release notes for upload
        run: |
          mkdir -p distribution/whatsnew
          for LOCALE in en-US ar ur; do
            cp play-store-notes.txt "distribution/whatsnew/whatsnew-${LOCALE}"
          done
          ls distribution/whatsnew

      # Fail before the upload can burn a version code Play will reject:
      # checks the FOREGROUND_SERVICE_MEDIA_PLAYBACK declaration and asks the
      # Play API whether this versionCode is actually publishable.
      - name: Play release preflight
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          PLAY_FGS_MEDIA_DECLARED: ${{ secrets.PLAY_FGS_MEDIA_DECLARED }}
        run: |
          # pubspec.yaml on this checkout is still pre-bump (the bump lives in
          # build-android's tree), so stamp the version the AAB was actually
          # built with before asking Play about its version code.
          sed -i 's/^version: .*/version: ${{ needs.prepare.outputs.new_version }}/' pubspec.yaml
          python3 tool/play_release_preflight.py \
            --package-name com.almarfa.tawheed \
            --manifest android/app/src/main/AndroidManifest.xml
          git checkout -- pubspec.yaml

      # Internal track testers get it immediately (status: completed).
      # Promoting internal -> production stays a manual step in Play Console —
      # a deliberate human safety gate.
      - name: Upload to Play Store (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.almarfa.tawheed
          releaseFiles: release-artifacts/${{ needs.prepare.outputs.aab }}
          track: internal
          status: completed
          whatsNewDirectory: distribution/whatsnew

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Requires github-actions[bot] in the master branch bypass list.
      - name: Commit, tag, and push
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"

          python3 tool/compute_release_version.py \
            --bump "${{ inputs.bump }}" --write --no-check-tag

          git add pubspec.yaml
          git commit -m "chore: release ${TAG}"
          git tag "${TAG}" -m "Release ${TAG}"
          # HEAD:master (not "master") — this checkout is detached at the
          # release SHA, so there is no local "master" branch to push.
          # ("src refspec master does not match any" otherwise.)
          git push origin HEAD:master
          git push origin "${TAG}"

      # CHANGELOG goes via env, not inline `${{ }}`, and the body via
      # --notes-file — commit subjects contain quotes and backticks that would
      # otherwise be re-parsed by bash.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG: ${{ steps.cliff.outputs.content }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          APK="${{ needs.prepare.outputs.apk }}"
          AAB="${{ needs.prepare.outputs.aab }}"
          NEW_VERSION="${{ needs.prepare.outputs.new_version }}"

          [ -z "$CHANGELOG" ] && CHANGELOG="- Maintenance release"

          cat > release-notes.md <<EOF
          ## What's changed

          ${CHANGELOG}

          ---
          **Build:** \`${NEW_VERSION}\`
          **APK:** release build, signed with the production key — install via \`adb install ${APK}\`
          **Verified:** installed, launched, backgrounded and resumed on an API 34 emulator
          **Play Store notes:** download \`play-store-notes.txt\` above — copy/paste into Play Console → What's new
          EOF

          gh release create "${TAG}" \
            "release-artifacts/${APK}#Al-Tawheed Android APK (release, signed)" \
            "release-artifacts/${AAB}#Al-Tawheed Android App Bundle (release, signed)" \
            "play-store-notes.txt#Play Store release notes (plain text)" \
            --title "Al-Tawheed ${TAG}" \
            --notes-file release-notes.md

  # ------------------------------------------------------------------ #
  # Dry run summary — a dry run must prove it BUILT and VERIFIED, not
  # merely that nothing errored. A cascade-skipped pipeline reports
  # success too; this step only runs if the real work did.
  # ------------------------------------------------------------------ #
  dry-run-summary:
    name: Dry run summary
    runs-on: ubuntu-latest
    needs: [prepare, build-android, verify-android]
    if: |
      always() &&
      inputs.dry_run == true &&
      needs.build-android.result == 'success' &&
      (needs.verify-android.result == 'success' || inputs.skip_verify == true)

    steps:
      - name: Report
        run: |
          echo "::notice::Dry run complete for ${{ github.ref_name }} — version ${{ needs.prepare.outputs.new_version }} computed, analyze/format/test passed, signed APK + AAB built and verified on device. Nothing was committed, tagged, pushed, released, or uploaded to the Play Store."
          {
            echo "### ✅ Dry run passed"
            echo ""
            echo "Would have released \`${{ needs.prepare.outputs.tag }}\` (\`${{ needs.prepare.outputs.new_version }}\`)."
            echo "Artifacts are attached to this run for 14 days."
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ #
  # Sync develop with master (CD Phase 1.5)
  #
  # `publish` commits the version bump + tag directly to master. Fast-forward
  # that into develop so the next release's promote doesn't hit a pubspec.yaml
  # conflict. Fast-forward only — if develop picked up its own commits since,
  # this fails rather than guessing at a merge.
  # ------------------------------------------------------------------ #
  sync-develop:
    name: Sync develop with master
    runs-on: ubuntu-latest
    needs: [publish]
    if: always() && needs.publish.result == 'success' && inputs.dry_run != true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Push to the protected `develop` branch as the repo owner (admin) so
          # the fast-forward isn't rejected by the "Flutter CI" required check —
          # the default GITHUB_TOKEN (github-actions[bot]) has no bypass.
          # checkout persists this token, so the later `git push` uses it.
          # See docs/gotchas.md → CI / release.
          token: ${{ secrets.DEVELOP_SYNC_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward develop to master
        run: |
          git fetch origin develop master
          git checkout -B develop origin/develop
          git merge --ff-only origin/master || {
            echo "::error::develop has diverged from master and cannot be fast-forwarded (develop likely picked up its own commits since the last sync). The release HAS already shipped — do not re-run the workflow. See docs/release-runbook.md -> Troubleshooting -> \"sync-develop failed: 'not possible to fast-forward'\" for the manual recovery."
            exit 1
          }
          git push origin develop
